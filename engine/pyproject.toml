[project]
name = "xrd-engine"
version = "0.4.0"
description = "XRD Studio 分析引擎"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
packaging = [
    "pyinstaller>=6.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xrd_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # 行长由 formatter 处理
    "B008",   # 允许函数默认值里调用(不适用于本项目)
    "RUF001", # 中文注释/字符串里允许全角标点与 × ≈ ° 等字符
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# h/k/l 是 Miller 指数的标准记号。把 l 改名只会让晶体学公式更难读,
# 所以在涉及 hkl 的模块里放行 E741。
"xrd_engine/high_ni/indexing.py" = ["E741"]
"xrd_engine/high_ni/analysis.py" = ["E741"]
"xrd_engine/peaks/annotate.py" = ["E741"]
"tests/test_annotate.py" = ["E741"]
"tests/test_indexing.py" = ["E741"]
"tests/test_high_ni.py" = ["E741"]
"scripts/make_fixtures.py" = ["E741"]
